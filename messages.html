<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="">
      <div class="header">
        <a href="index.html" class="">Back</a>
        <h2 class="">Grace Bisimwa</h2>
        <span class="">11:30</span>
      </div>

      <div class="messages">
        <span class="moment" id="">Today</span>

        <div class="scroll">
          <div class="message me">
            <p class="text">Hello, how are you?</p>
            <span class="time">11:30</span>
          </div>

          <div class="message sender">
            <p class="text">I'm good, thanks! How about you?</p>
            <span class="time">11:31</span>
          </div>

          <div class="message sender">
            <p class="text">I'm doing well too. What are you up to?</p>
            <span class="time">11:32</span>
          </div>

          <div class="message me">
            <p class="text">Just working on a project. You?</p>
            <span class="time">11:33</span>
          </div>

          <div class="message sender">
            <p class="text">Same here. Let's catch up later.</p>
            <span class="time">11:34</span>
          </div>

          <div class="message me">
            <p class="text">Sure! Talk to you later.</p>
            <span class="time">11:35</span>
          </div>
        </div>
      </div>

      <div class="input">
        <button class="plus">+</button>
        <input type="text" placeholder="Message..." />
        <button class="send">Send</button>
      </div>
    </main>
  </body>
</html>
